services:
  - type: web
    name: pantrypal
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend && npm ci --prefix frontend --include=dev && cd frontend && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
